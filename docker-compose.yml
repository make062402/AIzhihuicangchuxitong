# 智慧仓储 WMS · 客户单机部署（一条命令启动）
# ============================================================
# 使用方法：
#   1. 把这个文件和 Dockerfile 一起交付给客户
#   2. 客户在服务器上执行：
#        docker compose up -d
#   3. 打开浏览器访问：http://<服务器IP>:8080
#      默认账号：admin / admin123（首次登录必须改密）
# ============================================================
# 数据保存在同目录下的 ./wms-data/ 中，可随时打包备份

services:
  wms:
    build: .
    image: wms:latest
    container_name: wms
    restart: always
    ports:
      - "8080:3000"          # 对外端口 8080，如需修改改左边即可
    volumes:
      - ./wms-data:/app/data # 数据库文件持久化到宿主机
    environment:
      NODE_ENV: production
      # JWT_SECRET 建议改成随机字符串（openssl rand -hex 32）
      JWT_SECRET: "please-change-me-to-a-random-string-in-production"
      CORS_ORIGIN: "*"
